apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameserver-service
  namespace: gameserver-service
  labels:
    app: gameserver-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gameserver-service
  template:
    metadata:
      labels:
        app: gameserver-service
    spec:
      containers:
        - name: gameserver-service
          image: ghcr.io/nicktoony/gameserver-service2:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: gameserver-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
